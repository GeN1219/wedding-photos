<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Photos | ギャラリー</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="gate" class="gate">
  <div class="gate-card card">
    <h1>Gallery</h1>
    <p>管理用パスコードを入力してください</p>
    <input type="password" id="admin-pass" autocomplete="current-password">
    <p id="gate-error" class="error" hidden></p>
    <button id="gate-btn" class="btn btn-primary">開く</button>
  </div>
</div>

<main id="gallery-main" class="gallery-page" hidden>
  <header class="g-header">
    <h1>Wedding Photos</h1>
    <p id="stats" class="g-stats"></p>
  </header>
  <div id="grid" class="grid"></div>
  <p id="empty" class="g-empty" hidden>まだ写真がありません</p>
</main>

<div id="lightbox" class="lightbox" hidden>
  <button id="lb-close" class="lb-close" aria-label="閉じる">&#10005;</button>
  <div id="lb-content" class="lb-content"></div>
  <p id="lb-caption" class="lb-caption"></p>
</div>

<script src="./gallery.js"></script>
</body>
</html>
