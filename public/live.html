<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Photos | ライブムービー</title>
<link rel="stylesheet" href="./style.css">
</head>
<body class="live-body">
<div id="gate" class="gate">
  <div class="gate-card card">
    <h1>Live Movie</h1>
    <p>管理用パスコードを入力してください<br>(会場スクリーン投影用のページです)</p>
    <input type="password" id="admin-pass" autocomplete="current-password">
    <p id="gate-error" class="error" hidden></p>
    <button id="gate-btn" class="btn btn-primary">開始する</button>
  </div>
</div>

<div id="stage" class="live-stage" hidden>
  <h1 class="live-title">Wedding Photos</h1>
  <p id="waiting" class="live-waiting">写真が届くのをお待ちしています…</p>
  <div id="cards" class="live-cards"></div>

  <div id="toast" class="live-toast" hidden>
    <span class="live-toast-icon">&#128248;</span>
    <span id="toast-text"></span>
  </div>
  <div id="new-card" class="live-new" hidden></div>

  <button id="fs-btn" class="live-fs" title="全画面表示">&#x26F6;</button>
</div>

<script src="./live.js"></script>
</body>
</html>
