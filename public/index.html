<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Wedding Photos | 写真をお送りください</title>
<link rel="stylesheet" href="./style.css?v=6">
</head>
<body>
<main class="page">
  <header class="hero">
    <div class="ornament">&#10087;</div>
    <h1 class="hero-title">Wedding Photos</h1>
    <p class="lead">本日はありがとうございます。<br>撮影したお写真・動画をぜひお送りください。</p>
  </header>

  <section id="form-section" class="card">
    <label class="field">
      <span class="label">お名前 <em class="badge badge-opt">任意</em></span>
      <input type="text" id="uploader-name" placeholder="例: 山田太郎" autocomplete="name">
    </label>

    <label class="file-drop" for="file-input">
      <input type="file" id="file-input" multiple accept="image/*,video/*">
      <span class="file-drop-icon">&#128247;</span>
      <span id="file-label" class="file-drop-text">タップして写真・動画を選択</span>
    </label>
    <p id="file-summary" class="file-summary" hidden></p>
    <p id="form-error" class="error" hidden></p>

    <button id="upload-btn" class="btn btn-primary" disabled>アップロード</button>
    <p class="note">1ファイル最大95MB・複数選択できます</p>
  </section>

  <section id="progress-section" class="card" hidden>
    <h2 id="progress-title" class="section-title">送信中…</h2>
    <div class="overall">
      <div class="bar"><div id="overall-fill" class="bar-fill"></div></div>
      <p id="overall-text" class="overall-text"></p>
    </div>
    <ul id="file-list" class="file-list"></ul>
    <p id="progress-error" class="error" hidden></p>
    <button id="retry-btn" class="btn btn-primary" hidden>失敗したファイルを再送</button>
  </section>

  <section id="done-section" class="card done" hidden>
    <div class="done-icon">&#127881;</div>
    <h2 id="done-message" class="done-message"></h2>
    <p class="done-sub">素敵なお写真をありがとうございます。<br>下の「みんなの写真」に追加されました。</p>
    <button id="more-btn" class="btn btn-secondary">続けて送る</button>
  </section>
</main>

<section class="album">
  <div class="album-head">
    <h2 class="album-title">みんなの写真</h2>
    <p id="album-stats" class="album-stats"></p>
    <div class="album-actions">
      <button id="select-btn" class="btn-text" type="button">選択</button>
      <button id="refresh-btn" class="btn-text" type="button">&#8635; 最新にする</button>
    </div>
  </div>
  <p id="album-note" class="album-note">写真をタップすると大きく表示され、端末に保存できます。「選択」でまとめて保存もできます</p>
  <div id="grid" class="grid"></div>
  <div id="sentinel"></div>
  <p id="album-empty" class="album-empty" hidden>まだ写真がありません。最初の1枚をぜひ!</p>
  <p id="album-error" class="error" hidden></p>
  <footer class="footer">Wedding Photo Share</footer>
</section>

<div id="select-bar" class="select-bar" hidden>
  <p id="select-info" class="select-info"></p>
  <button id="select-save" class="btn btn-primary" type="button" disabled>保存</button>
</div>

<div id="lightbox" class="lightbox" hidden>
  <button id="lb-close" class="lb-close" aria-label="閉じる">&#10005;</button>
  <div id="lb-content" class="lb-content"></div>
  <p id="lb-caption" class="lb-caption"></p>
  <button id="lb-save" class="btn btn-primary lb-save" type="button">端末に保存</button>
  <p id="lb-hint" class="lb-hint">iPhoneは写真を長押しでも保存できます</p>
</div>

<script src="./app.js?v=6"></script>
<script src="./album.js?v=6"></script>
</body>
</html>
